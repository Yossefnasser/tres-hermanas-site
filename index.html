<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tres Hermanas Haute Joaillerie</title>

    <!-- Typography + icon system (same families as the Stitch export) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0"
      rel="stylesheet"
    />

    <!-- Tailwind (Play CDN, same as the Stitch export) + merged token config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'surface-tint': '#7d5700',
              'on-primary': '#ffffff',
              'surface-container-highest': '#e5e2e0',
              'outline-variant': '#d3c4b1',
              'secondary-fixed': '#d8e6d5',
              'on-error-container': '#93000a',
              'on-tertiary-fixed-variant': '#4f4539',
              'on-error': '#ffffff',
              'secondary-container': '#d6e4d2',
              'surface-variant': '#e5e2e0',
              'on-primary-fixed-variant': '#5f4100',
              'primary-container': '#c99738',
              'on-tertiary-fixed': '#221a10',
              'inverse-primary': '#f4be5b',
              outline: '#817564',
              tertiary: '#685c50',
              'error-container': '#ffdad6',
              surface: '#fcf9f6',
              'primary-fixed-dim': '#f4be5b',
              'tertiary-container': '#ab9d8e',
              'secondary-fixed-dim': '#bccaba',
              'on-secondary-fixed-variant': '#3e4a3d',
              'on-secondary-container': '#596658',
              'on-primary-fixed': '#271900',
              'tertiary-fixed': '#f0e0d0',
              'surface-container-lowest': '#ffffff',
              'surface-container-high': '#ebe8e5',
              'surface-bright': '#fcf9f6',
              primary: '#7d5700',
              'on-primary-container': '#4a3200',
              'on-secondary': '#ffffff',
              'inverse-on-surface': '#f3f0ee',
              'on-tertiary': '#ffffff',
              'on-tertiary-container': '#3e352a',
              'primary-fixed': '#ffdeaa',
              'tertiary-fixed-dim': '#d3c4b4',
              background: '#fcf9f6',
              'on-secondary-fixed': '#131e14',
              secondary: '#556254',
              'surface-container-low': '#f6f3f1',
              'inverse-surface': '#31302f',
              error: '#ba1a1a',
              'on-surface-variant': '#4f4536',
              'on-background': '#1c1c1a',
              'on-surface': '#1c1c1a',
              'surface-container': '#f0edeb',
              'surface-dim': '#dcd9d7'
            },
            borderRadius: {
              DEFAULT: '0.25rem',
              lg: '0.5rem',
              xl: '0.75rem',
              full: '9999px'
            },
            spacing: {
              margin: '4rem',
              'margin-mobile': '1.25rem',
              'space-xs': '0.25rem',
              'space-sm': '0.5rem',
              'space-md': '1rem',
              'space-lg': '1.5rem',
              'space-xl': '2.5rem',
              'space-2xl': '4rem',
              gutter: '1.5rem',
              'gutter-mobile': '0.75rem'
            },
            fontFamily: {
              'label-sm': ['"Plus Jakarta Sans"'],
              'label-md': ['"Plus Jakarta Sans"'],
              'label-lg': ['"Plus Jakarta Sans"'],
              'body-sm': ['"Plus Jakarta Sans"'],
              'body-md': ['"Plus Jakarta Sans"'],
              'body-lg': ['"Plus Jakarta Sans"'],
              'headline-sm': ['"EB Garamond"'],
              'headline-md': ['"EB Garamond"'],
              'headline-lg': ['"EB Garamond"'],
              'headline-lg-mobile': ['"EB Garamond"'],
              'display-lg': ['"EB Garamond"'],
              'display-lg-mobile': ['"EB Garamond"']
            },
            fontSize: {
              'label-sm': ['10px', { lineHeight: '12px', letterSpacing: '0.15em', fontWeight: '600' }],
              'label-md': ['11px', { lineHeight: '14px', letterSpacing: '0.12em', fontWeight: '600' }],
              'label-lg': ['12px', { lineHeight: '16px', letterSpacing: '0.14em', fontWeight: '600' }],
              'body-sm': ['13px', { lineHeight: '20px', letterSpacing: '0.01em', fontWeight: '400' }],
              'body-md': ['15px', { lineHeight: '24px', letterSpacing: '0em', fontWeight: '400' }],
              'body-lg': ['18px', { lineHeight: '28px', letterSpacing: '-0.01em', fontWeight: '400' }],
              'headline-sm': ['22px', { lineHeight: '28px', letterSpacing: '0.01em', fontWeight: '500' }],
              'headline-md': ['28px', { lineHeight: '36px', letterSpacing: '0em', fontWeight: '400' }],
              'headline-lg': ['40px', { lineHeight: '48px', letterSpacing: '-0.01em', fontWeight: '400' }],
              'headline-lg-mobile': ['28px', { lineHeight: '36px', letterSpacing: '0em', fontWeight: '400' }],
              'display-lg': ['56px', { lineHeight: '64px', letterSpacing: '-0.02em', fontWeight: '400' }],
              'display-lg-mobile': ['38px', { lineHeight: '44px', letterSpacing: '-0.01em', fontWeight: '400' }]
            }
          }
        }
      };
    </script>

    <style>
      @layer base {
        html,
        body {
          margin: 0;
          padding: 0;
        }
        body {
          overscroll-behavior: none;
          -webkit-tap-highlight-color: transparent;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
        main > :first-child {
          margin-top: 0 !important;
        }
        main > :last-child {
          margin-bottom: 0 !important;
        }
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.is-filled {
          font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
      }
      ::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
    </style>
  </head>

  <body class="bg-surface font-body-md text-body-md text-on-surface antialiased selection:bg-primary-fixed selection:text-on-primary-fixed">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
